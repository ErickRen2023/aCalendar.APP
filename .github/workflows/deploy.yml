name: Build and Deploy aCalendar FE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/erickren2023/acalendar-fe
  NODE_VERSION: "20"

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy container over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eu

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u erickren2023 --password-stdin
            docker network inspect nginx-net >/dev/null 2>&1 || docker network create nginx-net
            docker pull ${{ env.IMAGE }}:latest

            if docker ps -a --format '{{.Names}}' | grep -Fxq 'acalendar-fe'; then
              docker stop acalendar-fe || true
              docker rm acalendar-fe
            fi

            docker run --name acalendar-fe --network nginx-net --restart unless-stopped -d \
              ${{ env.IMAGE }}:latest
